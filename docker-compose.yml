name: stockify

services:
  postgres:
    image: postgres:17-alpine
    container_name: stockify-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - stockify-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - stockify-network

  server:
    build: .
    image: stockify-server:latest
    container_name: stockify-server
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Key: ${JwtSettings__Key}
      PlatformAdmin__Email: ${PlatformAdmin__Email}
      PlatformAdmin__Password: ${PlatformAdmin__Password}

    networks:
      - stockify-network

volumes:
  stockify-postgres-data:

networks:
  stockify-network:
    external: true
